name: Ubuntu Web OS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: manager
          POSTGRES_DB: ubuntu_web_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-state: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pg8000 pytest httpx
        
    - name: Run pytest
      env:
        DATABASE_URL: postgresql://postgres:manager@localhost:5432/ubuntu_web_os
        OS_WEBOS_SESSION_SECRET: ci-secret-key-123
        OS_WEBOS_USER: kali
        OS_WEBOS_PASS: kali
        LIAE_ENABLED: false
        DOCKER_ENABLED: false
      run: |
        pytest

  playwright-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install server dependencies
      run: |
        pip install fastapi uvicorn pg8000
        
    - name: Install Playwright dependencies
      run: |
        npm ci
        npx playwright install --with-deps
        
    - name: Run Playwright tests
      env:
        DATABASE_URL: postgresql://postgres:manager@localhost:5432/ubuntu_web_os
        OS_WEBOS_SESSION_SECRET: ci-secret-key-123
        OS_WEBOS_USER: kali
        OS_WEBOS_PASS: kali
        LIAE_ENABLED: false
      run: |
        npx playwright test --workers=1

  docker-build:
    runs-on: ubuntu-latest
    needs: playwright-tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: |
        docker build -t ubuntu-webos:latest .
